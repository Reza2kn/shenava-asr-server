[package]
name = "shenava-asr-server"
version = "0.1.1"
edition = "2021"
authors = ["Reza Sayar <rsayar@uvic.ca>"]
description = "Fully-Rust Shenava ASR HTTP server: tract (Koochik offline) + Rust fbank + shenava-ctc-beam hotword decode."
repository = "https://github.com/Reza2kn/shenava-asr-server"
homepage = "https://shenava.app"
license = "Apache-2.0"

[[bin]]
name = "shenava-asr-server"
path = "src/main.rs"

[features]
default = ["cpu-only"]
# Full tract runtime registry (CPU plus platform accelerators).
tract-runtime = ["dep:tract"]
# Minimal direct tract ONNX path for CPU-only Windows builds. This excludes the
# fork's target-level CUDA dependency entirely.
cpu-only = ["dep:tract-onnx"]
# CUDA backend (NVIDIA). Enables tract-cuda against the CUDA 13.0 driver API
# (dynamic-loaded at runtime; cudarc checks the driver >= 13.0). Off by default
# so the crate builds on any machine; enable with `--features cuda` on GPU hosts.
cuda = ["tract-runtime", "tract/cuda-13000"]
# Native Apple CoreML inference. This stays opt-in so Linux and Windows builds
# do not pull Apple framework bindings.
coreml = ["dep:coreml-native"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hound = "3.5"
rustfft = "6"
ndarray = "0.16"
shenava-ctc-beam = { git = "https://github.com/Reza2kn/shenava-ctc-beam" }
tract = { git = "https://github.com/Reza2kn/tract", branch = "shenava", default-features = false, optional = true }
tract-onnx = { git = "https://github.com/Reza2kn/tract", branch = "shenava", optional = true }
clap = { version = "4", features = ["derive", "string"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
coreml-native = { version = "0.2.0", optional = true }

[profile.release]
opt-level = 3
lto = true
